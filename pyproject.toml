[project]
name = "claudeaibridge"
version = "0.1.0"
description = "Run a coding agent on your own machine, driven from claude.ai via a custom MCP connector."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "ngrok>=1.0.0",
    "questionary>=2.0",
    "pyfiglet>=1.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
claudeaibridge = "claudeaibridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claudeaibridge*"]
