[project]
name = "claudeaibridge"
version = "0.1.0"
description = "Run a coding agent on your own machine, driven from claude.ai via a custom MCP connector."
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp[apps]>=3.4.0",
    "prefab-ui>=0.20.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "ngrok>=1.0.0",
    "questionary>=2.0",
    "pyfiglet>=1.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]
build = ["pyinstaller>=6.0"]

[project.scripts]
claudeaibridge = "claudeaibridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claudeaibridge*"]
